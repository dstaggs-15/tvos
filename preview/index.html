<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#05080f"><title>BGFTOS Preview</title><link rel="stylesheet" href="../web/launcher/styles.css"><style>.preview-badge{position:fixed;right:22px;bottom:18px;z-index:50;padding:8px 12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(3,6,12,.82);color:#8f99ad;font:12px "Segoe UI",sans-serif}.theme-picker{position:fixed;left:22px;bottom:18px;z-index:50;display:flex;gap:7px}.theme-picker button{border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#0b101b;color:#dfe5f3;padding:8px 10px;cursor:pointer}@media(max-width:700px){
html,body{min-height:100%;height:auto;overflow-x:hidden;overflow-y:auto}
body{padding-bottom:118px;background-attachment:fixed}
.topbar{height:auto;padding:18px 16px 8px;align-items:center}
.brand{gap:9px;padding:5px 6px}.bigfoot-mark{width:38px;height:38px}.brand-name{font-size:19px}
.top-right{gap:10px}#date{display:none}#clock{font-size:16px;min-width:auto}.round{width:42px;height:42px}
main{padding:0 16px}.hero{padding:24px 2px 14px}.hero h1{font-size:34px;line-height:1.02;max-width:340px}.sub{font-size:15px;line-height:1.45;max-width:330px}
#apps{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 0 20px}.app{height:112px;border-radius:19px}.app img{width:78%;height:58%}.app.selected{transform:none;box-shadow:0 0 0 2px rgba(102,126,234,.35),0 14px 34px rgba(0,0,0,.45)}
.theme-picker{position:fixed;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px;background:rgba(3,6,12,.88);border:1px solid rgba(255,255,255,.1);border-radius:15px;backdrop-filter:blur(18px)}
.theme-picker button{padding:10px 3px;font-size:11px;white-space:nowrap}.preview-badge{display:none}
.overlay{align-items:flex-end;padding:12px}.panel{width:100%;max-height:86vh;overflow:auto;padding:24px 18px;border-radius:25px}.panel h2{font-size:30px}.panel-actions{display:grid;grid-template-columns:1fr 1fr}.action{min-height:48px}
.info-row strong{font-size:12px}#toast{bottom:82px;width:max-content;max-width:88vw;text-align:center}
}
@media(max-width:380px){.hero h1{font-size:30px}.app{height:100px}.theme-picker button{font-size:10px}.top-right{gap:7px}}
</style></head>
<body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><div class="grain"></div><div class="seasonal-decor" aria-hidden="true"><div class="decor-top"></div><div class="decor-left"></div><div class="decor-right"></div><div class="decor-bottom"></div></div>
<header class="topbar"><button id="brand" class="brand focusable"><img class="bigfoot-mark" src="../assets/brand/bigfoot-mark.svg" alt="Bigfoot"><span class="brand-name">BGFTOS</span></button><div class="top-right"><div id="date"></div><div id="clock"></div><button id="settings" class="round focusable">⚙</button></div></header>
<main><section class="hero"><p class="eyebrow">WATCH</p><p class="sub">Choose a service</p></section><section id="apps"></section></main>
<div id="toast"></div><div id="panel" class="overlay hidden"><div class="panel"><div class="panel-head"><div><p class="eyebrow">BGFTOS</p><h2>System</h2></div><button id="panelClose" class="round focusable">×</button></div><div class="info-row"><span>Phone remote</span><strong id="remoteUrl">http://192.168.1.50:8765/remote/?token=preview</strong></div><p class="muted">Preview mode. On the HP this shows the private phone remote address for your home network.</p><div class="panel-actions"><button id="sleepButton" class="action focusable">Sleep PC</button><button id="refreshButton" class="action focusable">Refresh Home</button></div></div></div>
<div class="theme-picker"><button data-theme="default">Dark</button><button data-theme="halloween">Halloween</button><button data-theme="thanksgiving">Thanksgiving</button><button data-theme="christmas">Christmas</button></div><div class="preview-badge">BROWSER PREVIEW · Windows controls simulated</div>
<script>
const services=[{"id":"fubo","name":"Fubo","url":"#","icon":"../assets/services/fubo.svg"},{"id":"netflix","name":"Netflix","url":"#","icon":"../assets/services/netflix.svg"},{"id":"disney","name":"Disney+","url":"#","icon":"../assets/services/disney.svg"},{"id":"prime","name":"Prime Video","url":"#","icon":"../assets/services/prime.svg"},{"id":"youtube","name":"YouTube","url":"#","icon":"../assets/services/youtube.svg"},{"id":"tubi","name":"Tubi","url":"#","icon":"../assets/services/tubi.svg"}];
let selected=0,columns=3,panelOpen=false;const apps=document.getElementById("apps"),panel=document.getElementById("panel"),toast=document.getElementById("toast");
function render(){apps.innerHTML="";services.forEach((s,i)=>{const tile=document.createElement("div");tile.className="app"+(i===selected?" selected":"");tile.setAttribute("role","button");const img=document.createElement("img");img.src=s.icon;img.alt=s.name;tile.appendChild(img);tile.onclick=()=>{selected=i;render();showToast(s.name+" launch is simulated in preview mode")};apps.appendChild(tile)})}
function showToast(m){toast.textContent=m;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200)}
function openPanel(){panelOpen=true;panel.classList.remove("hidden")}function closePanel(){panelOpen=false;panel.classList.add("hidden")}
function clock(){const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});document.getElementById("date").textContent=d.toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"})}
document.getElementById("settings").onclick=openPanel;document.getElementById("brand").onclick=openPanel;document.getElementById("panelClose").onclick=closePanel;document.getElementById("sleepButton").onclick=()=>showToast("Sleep is simulated in preview mode");document.getElementById("refreshButton").onclick=()=>showToast("Home refreshed");
document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>document.body.dataset.theme=b.dataset.theme);
document.addEventListener("keydown",e=>{if(panelOpen){if(e.key==="Escape"||e.key==="Backspace")closePanel();return}let h=true;switch(e.key){case"ArrowRight":selected=Math.min(selected+1,services.length-1);break;case"ArrowLeft":selected=Math.max(selected-1,0);break;case"ArrowDown":selected=Math.min(selected+columns,services.length-1);break;case"ArrowUp":selected=Math.max(selected-columns,0);break;case"Enter":showToast(services[selected].name+" launch is simulated in preview mode");return;default:h=false}if(h){e.preventDefault();render()}});render();clock();setInterval(clock,15000);
</script></body></html>
