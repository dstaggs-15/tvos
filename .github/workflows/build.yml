name: Build Windows package
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore .\src\TVOS\TVOS.csproj
      - run: dotnet publish .\src\TVOS\TVOS.csproj -c Release -r win-x64 --self-contained true -o .\publish
      - uses: actions/upload-artifact@v4
        with:
          name: TVOS-win-x64
          path: |
            publish
            web
            assets
            config
            scripts
            README.md
