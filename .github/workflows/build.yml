name: Production Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  production:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Windows x64
        run: dotnet restore .\src\TVOS\TVOS.csproj -r win-x64
      - name: Build Release
        run: dotnet build .\src\TVOS\TVOS.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained Windows x64
        run: dotnet publish .\src\TVOS\TVOS.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\stage\app
      - name: Validate published executable
        shell: pwsh
        run: |
          if (-not (Test-Path .\stage\app\BGFTOS.exe)) { throw "BGFTOS.exe was not published." }
          if (-not (Test-Path .\stage\app\Microsoft.Web.WebView2.Core.dll)) { throw "WebView2 assemblies are missing." }
          if ((Get-Item .\stage\app\BGFTOS.exe).Length -lt 10000) { throw "BGFTOS.exe is unexpectedly small." }
      - name: Validate installer scripts
        shell: pwsh
        run: |
          foreach($script in @(".\scripts\install.ps1",".\scripts\update.ps1",".\scripts\uninstall.ps1")){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_.Message};throw "PowerShell syntax validation failed: $script"}
          }
      - name: Assemble production package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\package | Out-Null
          Copy-Item .\stage\app .\package\app -Recurse
          Copy-Item .\web .\package\web -Recurse
          Copy-Item .\assets .\package\assets -Recurse
          Copy-Item .\config .\package\config -Recurse
          Copy-Item .\scripts .\package\scripts -Recurse
          Copy-Item .\Install-BGFTOS.cmd .\package\Install-BGFTOS.cmd
          Copy-Item .\Update-BGFTOS.cmd .\package\Update-BGFTOS.cmd
          Copy-Item .\README.md .\package\README.md
      - name: Validate package
        shell: pwsh
        run: |
          $required=@(".\package\app\BGFTOS.exe",".\package\web\launcher\index.html",".\package\web\remote\index.html",".\package\web\remote\remote.js",".\package\assets\brand\bigfoot-mark.svg",".\package\config\services.default.json",".\package\config\settings.default.json",".\package\scripts\install.ps1",".\package\Install-BGFTOS.cmd")
          foreach($file in $required){if(-not(Test-Path $file)){throw "Missing production file: $file"}}
          $services=Get-Content .\package\config\services.default.json -Raw | ConvertFrom-Json
          foreach($service in $services.services){
            if([string]::IsNullOrWhiteSpace($service.icon)){throw "Built-in service has blank artwork path: $($service.id)"}
            $asset=Join-Path ".\package" ($service.icon -replace '/','\')
            if(-not(Test-Path $asset)){throw "Built-in service artwork is missing: $asset"}
          }
          $launcher=Get-Content .\package\web\launcher\app.js -Raw
          if($launcher -notmatch 'bgftos\.local'){throw "Launcher is not configured for the WebView2 asset virtual host."}
      - uses: actions/upload-artifact@v4
        with:
          name: BGFTOS-win-x64
          path: package
          if-no-files-found: error
