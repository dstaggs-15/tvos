name: Production Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  production:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore .\src\TVOS\TVOS.csproj
      - name: Build
        run: dotnet build .\src\TVOS\TVOS.csproj -c Release --no-restore
      - name: Publish self-contained Windows x64
        run: dotnet publish .\src\TVOS\TVOS.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\stage\app
      - name: Assemble BGFT OS package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\package | Out-Null
          Copy-Item .\stage\app .\package\app -Recurse
          Copy-Item .\web .\package\web -Recurse
          Copy-Item .\assets .\package\assets -Recurse
          Copy-Item .\config .\package\config -Recurse
          Copy-Item .\scripts .\package\scripts -Recurse
          Copy-Item .\README.md .\package\README.md
          Compress-Archive -Path .\package\* -DestinationPath .\BGFT-OS-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BGFT-OS-win-x64
          path: BGFT-OS-win-x64.zip
          if-no-files-found: error
