name: Production Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  production:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Windows x64
        run: dotnet restore .\src\TVOS\TVOS.csproj -r win-x64
      - name: Build Release
        run: dotnet build .\src\TVOS\TVOS.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained Windows x64
        run: dotnet publish .\src\TVOS\TVOS.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\stage\app
      - name: Validate published executable
        shell: pwsh
        run: |
          if (-not (Test-Path .\stage\app\BGFTOS.exe)) { throw "BGFTOS.exe was not published." }
          if (-not (Test-Path .\stage\app\Microsoft.Web.WebView2.Core.dll)) { throw "WebView2 assemblies are missing." }
          if ((Get-Item .\stage\app\BGFTOS.exe).Length -lt 10000) { throw "BGFTOS.exe is unexpectedly small." }
      - name: Assemble production package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\package | Out-Null
          Copy-Item .\stage\app .\package\app -Recurse
          Copy-Item .\web .\package\web -Recurse
          Copy-Item .\assets .\package\assets -Recurse
          Copy-Item .\config .\package\config -Recurse
          Copy-Item .\scripts .\package\scripts -Recurse
          Copy-Item .\Install-BGFTOS.cmd .\package\Install-BGFTOS.cmd
          Copy-Item .\Update-BGFTOS.cmd .\package\Update-BGFTOS.cmd
          Copy-Item .\README.md .\package\README.md
      - name: Validate package
        shell: pwsh
        run: |
          $required=@(".\package\app\BGFTOS.exe",".\package\web\launcher\index.html",".\package\web\remote\index.html",".\package\assets\brand\bigfoot-mark.svg",".\package\config\services.default.json",".\package\config\settings.default.json",".\package\scripts\install.ps1",".\package\Install-BGFTOS.cmd")
          foreach($file in $required){if(-not(Test-Path $file)){throw "Missing production file: $file"}}
          Compress-Archive -Path .\package\* -DestinationPath .\BGFTOS-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BGFTOS-win-x64
          path: BGFTOS-win-x64.zip
          if-no-files-found: error
