<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TVOS Remote</title><link rel="stylesheet" href="remote.css"></head><body><header><b>TVOS Remote</b><button id="manage">Apps</button></header><main><section id="remote"><div id="services"></div><div class="pad"><button data-a="up">▲</button><div><button data-a="left">◀</button><button class="ok" data-a="ok">OK</button><button data-a="right">▶</button></div><button data-a="down">▼</button></div><div class="row"><button data-a="back">Back</button><button data-a="home">Home</button><button data-a="playpause">Play/Pause</button></div><div class="type"><input id="text" placeholder="Type on TV"><button id="send">Send</button></div><button class="sleep" data-a="sleep">Sleep PC</button></section><section id="manager" hidden><h2>Apps</h2><div id="appList"></div><h3>Add service</h3><input id="newName" placeholder="Name"><input id="newUrl" placeholder="https://..."><button id="add">Add</button><button id="done">Done</button></section></main><script src="remote.js"></script></body></html>
