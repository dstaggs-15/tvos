<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0a1020"><title>BGFT OS Remote</title><link rel="stylesheet" href="remote.css"></head><body><header><div class="brand"><img src="/remote/bgft-mark.svg"><span><b>BGFT</b><small>OS REMOTE</small></span></div><button id="manage">Apps</button></header><main><section id="remote"><div id="services" class="services"></div><div class="pad"><button data-a="up">▲</button><div><button data-a="left">◀</button><button class="ok" data-a="ok">OK</button><button data-a="right">▶</button></div><button data-a="down">▼</button></div><div class="row"><button data-a="back">Back</button><button class="home" data-a="home">Home</button><button data-a="playpause">Play / Pause</button></div><div class="type"><input id="text" autocomplete="off" placeholder="Type on the TV"><button id="send">Send</button></div><button class="sleep" data-a="sleep">Sleep PC</button></section><section id="manager" hidden><div class="managerHead"><div><small>BGFT OS</small><h2>Streaming apps</h2></div><button id="done">Done</button></div><div id="appList"></div><div class="addCard"><h3>Add a service</h3><input id="newName" placeholder="Service name"><input id="newUrl" inputmode="url" placeholder="https://example.com"><button id="add">Add to Home</button><p id="status"></p></div></section></main><script src="remote.js"></script></body></html>
